<style>

<!-- The small icon Android puts in the status bar. Android throws the colours
     away and keeps only the alpha channel, so this must be the mark drawn in
     solid white on nothing at all: a filled square comes out as a white block,
     which is exactly what the colour icon was doing. No frame either — at
     status-bar size the badge outline closes up into a smudge. -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="capline"><rect x="0" y="192" width="512" height="128"/></clipPath>
  </defs>
  <!-- EBM from the logo, blown up to fill the canvas edge to edge -->
  <g transform="translate(256 256) scale(1.33) translate(-248.5 -256)">
    <g clip-path="url(#capline)" fill="none" stroke="#fff" stroke-width="30"
       stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M101 192 V320"/>
      <path d="M86 207 H176"/>
      <path d="M86 256 H162"/>
      <path d="M86 305 H176"/>
      <path d="M212 192 V320"/>
      <path d="M197 207 H253"/>
      <path d="M197 256 H253"/>
      <path d="M197 305 H253"/>
      <path d="M253 207 a24.5 24.5 0 0 1 0 49"/>
      <path d="M253 256 a24.5 24.5 0 0 1 0 49"/>
      <path d="M329 320 L329 192 L370 264 L411 192 L411 320"/>
    </g>
  </g>
</svg>
